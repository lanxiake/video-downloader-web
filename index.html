<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>视频去水印</title>
<style>
:root{
  --bg:#08090b; --panel:#101215; --panel2:#16191d; --line:#22262c; --line2:#2e343c;
  --text:#e8eaed; --dim:#7d858f; --dim2:#4a5259;
  --accent:#00e08a; --accent-dim:#00e08a22; --warn:#ff8a3d;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom) + 96px);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    radial-gradient(90% 60% at 50% 0%,rgba(0,224,138,.05),transparent 70%);
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:12px 16px;margin:0 -16px 20px;
  background:linear-gradient(180deg,rgba(8,9,11,.97) 60%,rgba(8,9,11,0));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.mark{
  width:28px;height:28px;flex:0 0 28px;position:relative;
  border:1px solid var(--accent);border-radius:var(--r);
  display:grid;place-items:center;
}
.mark::before{content:"";width:10px;height:10px;border:1.5px solid var(--accent);border-radius:1px;
  border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-45deg) translate(1px,1px)}
.mark::after{content:"";position:absolute;inset:0;border-radius:var(--r);
  box-shadow:0 0 10px rgba(0,224,138,.35) inset;opacity:.7}
h1{font-size:15px;font-weight:600;letter-spacing:.06em;margin:0}
h1 em{font-style:normal;color:var(--dim2);font-weight:400;letter-spacing:.02em;font-size:12px;margin-left:6px}
.state{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 7px var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.dot.busy{background:var(--warn);box-shadow:0 0 7px var(--warn);animation-duration:.9s}
.dot.err{background:#ff4d5e;box-shadow:0 0 7px #ff4d5e;animation:none}

/* ── 输入态 ── */
.lede{margin:0 0 22px}
.lede .big{font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
.lede .big b{color:var(--accent);font-weight:700}
.lede p{margin:0;color:var(--dim);font-size:13.5px}

.field{position:relative;margin-bottom:10px}
textarea{
  width:100%;min-height:88px;resize:none;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text);font-size:16px;font-family:var(--sans);line-height:1.5;outline:none;
  transition:border-color .18s,background .18s;
}
textarea::placeholder{color:var(--dim2)}
textarea:focus{border-color:var(--accent);background:#0e1210}
textarea::-webkit-scrollbar{width:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px;border:none;border-radius:var(--r);cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;
  background:var(--accent);color:#00170e;
  transition:transform .1s,box-shadow .18s,opacity .18s;
  box-shadow:0 0 0 0 var(--accent-dim);
}
.btn:active{transform:scale(.985);box-shadow:0 0 0 4px var(--accent-dim)}
.btn:disabled{background:var(--panel2);color:var(--dim2);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text);font-weight:500}
.btn.ghost:active{border-color:var(--dim);box-shadow:none}
.btn.sm{padding:12px;font-size:13.5px}

.plats{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.plats span{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);
  padding:4px 9px;border:1px solid var(--line);border-radius:2px;
}
.plats span.ok{color:var(--accent);border-color:#00e08a33}

/* ── 进度 ── */
.prog{display:none;margin-top:16px}
.bar{height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.bar.indet>i{width:30%;animation:sweep 1.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{0%{margin-left:-30%}100%{margin-left:100%}}
.pmeta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.pmeta .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.err{display:none;margin-top:14px;padding:12px;border-left:2px solid #ff4d5e;
  background:#ff4d5e0f;color:#ff8a94;font-size:12.5px;line-height:1.6;
  border-radius:0 var(--r) var(--r) 0;word-break:break-word}

/* ── 编辑态 ── */
#editor{display:none}
.frame{
  position:relative;background:#000;overflow:hidden;border-radius:var(--r);
  margin:0 auto 6px;border:1px solid var(--line);
  width:-moz-fit-content;width:fit-content;max-width:100%;
}
/* 竖屏视频按宽度铺满会顶穿一屏，限高后等比缩，画面整体始终看得见 */
.frame canvas{display:block;width:auto;height:auto;
  max-width:100%;max-height:min(64vh,560px)}
.frame video{display:none}
.guide{position:absolute;pointer-events:none;inset:0;
  background-image:linear-gradient(rgba(0,224,138,.22) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,224,138,.22) 1px,transparent 1px);
  background-size:33.33% 33.33%;opacity:0;transition:opacity .25s}
.frame.grid .guide{opacity:1}
.corner{position:absolute;width:12px;height:12px;border:1.5px solid var(--accent);opacity:0;transition:opacity .2s}
.frame.grid .corner{opacity:.9}
.corner.tl{top:6px;left:6px;border-right:none;border-bottom:none}
.corner.tr{top:6px;right:6px;border-left:none;border-bottom:none}
.corner.bl{bottom:6px;left:6px;border-right:none;border-top:none}
.corner.br{bottom:6px;right:6px;border-left:none;border-top:none}
.tag{
  position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:2px;
  background:rgba(0,0,0,.72);border:1px solid #00e08a44;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent);
}
.meta{display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  letter-spacing:.05em;margin:0 0 22px 2px}

/* 自定义框选层 */
.sel-layer{position:absolute;inset:0;touch-action:none;display:none}
.showsel .sel-layer{display:block}
/* 只有自定义模式才给把手（其余模式框是只读示意） */
.sel .h{display:none}
.custom.showsel .sel .h{display:block}
.sel{position:absolute;border:1.5px solid var(--accent);cursor:move;
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 16px rgba(0,224,138,.28)}
.sel .fill{position:absolute;inset:0;background:rgba(0,224,138,.06)}
/* 框外遮罩：一眼看出哪块会被切掉 */
.mk{position:absolute;background:rgba(0,0,0,.58);pointer-events:none;display:none}
.cutmode .mk{display:block}
.h{position:absolute;width:44px;height:44px;z-index:3}
.h::after{content:"";position:absolute;background:var(--accent);border-radius:1px;
  box-shadow:0 0 0 1px rgba(0,0,0,.55)}
/* 四角 L 形 */
.h.tl,.h.tr,.h.bl,.h.br{width:44px;height:44px}
.h.tl{left:-22px;top:-22px}.h.tr{right:-22px;top:-22px}
.h.bl{left:-22px;bottom:-22px}.h.br{right:-22px;bottom:-22px}
.h.tl::after{left:8px;top:8px;width:15px;height:15px;background:none;
  border:2.5px solid var(--accent);border-right:none;border-bottom:none}
.h.tr::after{right:8px;top:8px;width:15px;height:15px;background:none;
  border:2.5px solid var(--accent);border-left:none;border-bottom:none}
.h.bl::after{left:8px;bottom:8px;width:15px;height:15px;background:none;
  border:2.5px solid var(--accent);border-right:none;border-top:none}
.h.br::after{right:8px;bottom:8px;width:15px;height:15px;background:none;
  border:2.5px solid var(--accent);border-left:none;border-top:none}
/* 四边中点 */
.h.t{left:50%;top:-22px;margin-left:-22px}
.h.b{left:50%;bottom:-22px;margin-left:-22px}
.h.l{top:50%;left:-22px;margin-top:-22px}
.h.r{top:50%;right:-22px;margin-top:-22px}
.h.t::after,.h.b::after{left:50%;margin-left:-11px;width:22px;height:3.5px;border-radius:2px}
.h.t::after{top:14px}.h.b::after{bottom:14px}
.h.l::after,.h.r::after{top:50%;margin-top:-11px;width:3.5px;height:22px;border-radius:2px}
.h.l::after{left:14px}.h.r::after{right:14px}
/* 放大镜：拖动时看清水印到底框住哪了 */
.loupe{
  position:fixed;left:0;top:0;width:140px;height:140px;border-radius:50%;
  border:2px solid var(--accent);overflow:hidden;pointer-events:none;
  box-shadow:0 0 0 2px rgba(0,0,0,.75),0 10px 30px rgba(0,0,0,.65);
  opacity:0;transition:opacity .12s;z-index:9999;background:#000;
}
.loupe.on{opacity:1}
.loupe canvas{display:block;width:140px;height:140px;image-rendering:auto}
/* 拖动时压暗减轻，方便看清底下的水印 */
.sel-layer.dragging .mk{opacity:.34}
.sel-layer.dragging .sel{border-width:2px;
  box-shadow:0 0 0 1px rgba(0,0,0,.7),0 0 26px rgba(0,224,138,.5)}
.sel-layer.dragging .h::after{filter:brightness(1.25)}
/* 自定义模式提示 */
.custom-only{display:none}
.custom .custom-only{display:block}
.helpbar{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px 2px;
  font-size:12.5px;line-height:1.55;color:var(--accent)}
.helpbar svg{flex:0 0 15px;margin-top:2px;opacity:.85}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.quick button{
  font-family:var(--sans);font-size:12px;padding:8px 13px;border-radius:2px;
  background:var(--panel);border:1px solid var(--line2);color:var(--dim);
}
.quick button:active{border-color:var(--accent);color:var(--accent)}
.quick button.rset{border-color:#00e08a55;color:var(--accent)}
.gap{height:9px}
.ttl{margin:12px 0 0;text-align:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;color:var(--dim2);line-height:1.7}
.ttl b{color:var(--warn);font-weight:500}

/* ── 模式选择 ── */
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim2);
  text-transform:uppercase;margin:0 0 10px 2px}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mode{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;transition:border-color .18s,background .18s;position:relative;overflow:hidden;
}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .18s}
.mode:active{background:var(--panel2)}
.mode.on{border-color:#00e08a55;background:#0d1411}
.mode.on::before{background:var(--accent)}
.ic{width:26px;height:26px;flex:0 0 26px;border:1px solid var(--line2);border-radius:2px;
  display:grid;place-items:center;transition:border-color .18s}
.mode.on .ic{border-color:var(--accent)}
.ic svg{width:14px;height:14px;stroke:var(--dim);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s}
.mode.on .ic svg{stroke:var(--accent)}
.mbody{flex:1;min-width:0}
.mtitle{font-size:14px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:7px}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:1.5px 6px;border-radius:2px;
  background:#00e08a1a;color:var(--accent);border:1px solid #00e08a33}
.pill.w{background:#ff8a3d1a;color:var(--warn);border-color:#ff8a3d33}
.mdesc{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}

/* ── 折叠 ── */
.fold{border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden;
  background:var(--panel)}
.fold>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:8px;
  font-size:13.5px;color:var(--dim);user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";margin-left:auto;width:6px;height:6px;
  border-right:1.5px solid var(--dim2);border-bottom:1.5px solid var(--dim2);
  transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.fold[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.fold[open]>summary{color:var(--text)}
.fbody{padding:0 14px 14px}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.trow:last-child{margin-bottom:0}
.trow .lb{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim2);
  width:34px;flex:0 0 34px}
.trow .vv{font-family:var(--mono);font-size:11px;color:var(--accent);width:44px;
  text-align:right;flex:0 0 44px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:24px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);margin-top:-8px;box-shadow:0 0 0 4px rgba(0,224,138,.14)}

/* ── 底部操作栏 ── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,9,11,0),rgba(8,9,11,.92) 26%,#08090b 60%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dock.on{display:block}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:9px}
.dock .btn{flex:1}
.dock .btn.mini{flex:0 0 96px;padding:16px 0;font-size:13px}

/* ── 结果 ── */
#result{display:none}
.result-hd{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ok-mark{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.ok-mark svg{width:12px;height:12px;stroke:#00170e;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.result-hd h2{font-size:16px;margin:0;font-weight:600}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0 18px}
.spec{background:var(--panel);padding:11px 12px}
.spec .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.spec .v{font-family:var(--mono);font-size:14px;color:var(--text);margin-top:3px;letter-spacing:-.01em}
.modeline{margin:-6px 2px 14px;font-size:12.5px;color:var(--dim)}
.modeline b{color:var(--accent);font-weight:500}

/* ── 全屏预览 ── */
.sheet{position:fixed;inset:0;z-index:200;background:#000;display:none;
  flex-direction:column;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 16px)}
.sheet.on{display:flex}
.sheet .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;
  color:#fff;font-size:19px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.sheet .body{flex:1;display:grid;place-items:center;padding:56px 12px 12px;overflow:hidden}
.sheet canvas{max-width:100%;max-height:100%;border-radius:2px}
.sheet .note{text-align:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;color:var(--dim);padding:0 20px 6px}

.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,23,14,.25);
  border-top-color:#00170e;border-radius:50%;animation:sp .7s linear infinite}
.spin.lt{border-color:rgba(232,234,237,.2);border-top-color:var(--text)}
@keyframes sp{to{transform:rotate(360deg)}}

.foot{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--dim2);padding:26px 0 8px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"></div>
    <h1>去水印<em id="brandSub"></em></h1>
    <div class="state"><span class="dot" id="dot"></span><span id="stateTxt">就绪</span></div>
  </header>

  <!-- ══ 输入态 ══ -->
  <section id="inputView">
    <div class="lede">
      <p class="big">把视频链接丢进来，<br><b>框掉水印</b>，存到手机。</p>
      <p>抖音 / B站 / 小红书 / 微博 / AcFun / 虎牙，粘贴整段分享文字也行。</p>
    </div>

    <div class="field">
      <textarea id="url" placeholder="粘贴链接或分享文本…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>
    <button class="btn" id="go">解析视频</button>

    <div class="plats">
      <span>抖音</span><span>B站</span><span>小红书</span><span>微博</span><span>AcFun</span><span>虎牙</span><span>网易云</span>
    </div>

    <div class="prog" id="prog">
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="pmeta"><span class="t" id="pTitle">准备中…</span><span id="pPct"></span></div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <!-- ══ 编辑态 ══ -->
  <section id="editor">
    <p class="sect">预览 · 第一帧</p>
    <div class="frame" id="frame">
      <video id="v" playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
      <canvas id="cv"></canvas>
      <div class="guide"></div>
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="tag" id="tag">等待</div>
    </div>
    <div class="meta" id="meta"></div>

    <div class="custom-only" id="customBox">
      <div class="helpbar">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span id="helpTxt">拖住白点调整范围，框外画面会被切掉</span>
      </div>
      <div class="quick" id="quickBox">
        <button data-q="all">全画面</button>
        <button data-q="tl">左上角</button>
        <button data-q="tr">右上角</button>
        <button data-q="bl">左下角</button>
        <button data-q="br">右下角</button>
        <button data-q="reset" class="rset">↺ 恢复自动</button>
      </div>
    </div>

    <p class="sect">去水印方式</p>
    <div class="modes" id="modes">
      <div class="mode" data-m="crop">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></div>
        <div class="mbody">
          <div class="mtitle">标准裁切 <span class="pill">推荐</span></div>
          <div class="mdesc" id="dCrop">按本平台水印位置切掉多余画面</div>
        </div>
      </div>
      <div class="mode" data-m="blur">
        <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
        <div class="mbody">
          <div class="mtitle">标准打码 <span class="pill">不变形</span></div>
          <div class="mdesc" id="dBlur">只把水印那块糊掉，构图和画幅都保留</div>
        </div>
      </div>
      <div class="mode" data-m="custom">
        <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1" stroke-dasharray="3 3"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
        <div class="mbody">
          <div class="mtitle">自定义框选</div>
          <div class="mdesc">自己拖框，可选裁切或模糊</div>
        </div>
      </div>
    </div>

    <details class="fold" id="advFold">
      <summary>截取片段 · 自定义参数</summary>
      <div class="fbody">
        <div class="trow">
          <span class="lb">起点</span>
          <input type="range" id="tStart" min="0" max="1000" value="0">
          <span class="vv" id="vStart">00:00</span>
        </div>
        <div class="trow">
          <span class="lb">终点</span>
          <input type="range" id="tEnd" min="0" max="1000" value="1000">
          <span class="vv" id="vEnd">00:00</span>
        </div>
        <div class="modes" id="subModes" style="margin:10px 0 0">
          <div class="mode" data-s="crop">
            <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg></div>
            <div class="mbody"><div class="mtitle">框内裁切</div></div>
          </div>
          <div class="mode" data-s="blur">
            <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></div>
            <div class="mbody"><div class="mtitle">框内打码</div></div>
          </div>
        </div>
      </div>
    </details>

    <div class="foot">本地处理 · 不上传第三方</div>
  </section>

  <!-- ══ 结果态 ══ -->
  <section id="result">
    <div class="result-hd">
      <div class="ok-mark"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <h2>导出完成</h2>
    </div>
    <div class="frame"><video id="rv" controls playsinline webkit-playsinline></video></div>
    <div class="specs" id="specs"></div>
    <div class="modeline" id="modeLine"></div>
    <button class="btn" id="saveBtn">保存到手机</button>
    <div class="gap"></div>
    <button class="btn ghost" id="copyBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 5H6a1 1 0 0 0-1 1v9"/></svg>
      复制下载链接
    </button>
    <div class="gap"></div>
    <button class="btn ghost sm" id="againBtn">再处理一次</button>
    <p class="ttl" id="ttlTip"></p>
    <div class="foot">长按视频也可直接保存</div>
  </section>
</div>

<!-- 底部固定操作栏 -->
<div class="dock" id="dock">
  <div class="dock-in">
    <button class="btn ghost mini" id="previewBtn">全屏预览</button>
    <button class="btn" id="exportBtn">导出视频</button>
  </div>
</div>

<!-- 全屏预览层 -->
<div class="sheet" id="sheet">
  <button class="close" id="sheetClose">✕</button>
  <div class="body"><canvas id="sheetCv"></canvas></div>
  <div class="note" id="sheetNote"></div>
</div>

<script src="app.js"></script>
</body>
</html>
